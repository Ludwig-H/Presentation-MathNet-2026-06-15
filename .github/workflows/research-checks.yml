name: Research checks

on:
  push:
    paths:
      - "**/*.md"
      - ".agents/**"
      - ".github/workflows/research-checks.yml"
      - "research/**"
      - "README.md"
  pull_request:
    paths:
      - "**/*.md"
      - ".agents/**"
      - ".github/workflows/research-checks.yml"
      - "research/**"
      - "README.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Markdown mathematics
        run: python3 .agents/check_math.py

      - name: Validate relative Markdown links
        run: python3 .agents/check_markdown_links.py

      - name: Check finite cluster kernels
        run: python3 research/check_hierarchy.py

      - name: Check critical cut inside the giant
        run: python3 research/check_giant_cut.py

      - name: Compile Python modules
        run: python3 -m py_compile research/check_hierarchy.py research/check_giant_cut.py
