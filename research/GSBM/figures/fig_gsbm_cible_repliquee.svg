<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title desc">
  <title id="title">Cible répliquée contre enveloppe de Jensen à L = 4</title>
  <desc id="desc">Pour p entre 0,70 et 0,836 sur le tore triangulaire 4 par 4, la cible répliquée D (moyenne en dendrogramme avant le carré) reste très en dessous de l'enveloppe de Jensen J (carré avant la moyenne) : le ratio D sur J vaut 6, 10, 15, 19 et 19 pour cent. La zone entre les deux courbes est la part détruite par la moyenne signée.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .label { font: 500 15px Inter, Arial, sans-serif; fill: #334155; }
      .strong { font: 700 16px Inter, Arial, sans-serif; fill: #172033; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 12px Inter, Arial, sans-serif; fill: #64748b; }
      .ratio { font: 700 14px Inter, Arial, sans-serif; fill: #6d4aff; }
      .axis { stroke: #334155; stroke-width: 2; }
      .grid { stroke: #e2e8f0; stroke-width: 1.5; }
      .jline { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .dline { fill: none; stroke: #6d4aff; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .guide2 { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 6; }
      .guide { stroke: #e5484d; stroke-width: 2; stroke-dasharray: 8 6; }
    </style>
  </defs>
  <rect width="1440" height="780" fill="#f8fafc"/>
  <text x="720" y="42" text-anchor="middle" class="title">La moyenne en dendrogramme détruit 81 à 94 % de l'enveloppe (L = 4)</text>
  <text x="720" y="70" text-anchor="middle" class="subtitle">tore triangulaire 4×4, intérieur exact (2¹⁶ configurations), n_obs = 12, K = 8 dendrogrammes, graine 20260805 ; contrôle 20260806 en creux</text>

  <!-- grid -->
  <line x1="150" y1="620" x2="1300" y2="620" class="grid"/>
  <line x1="150" y1="506.4" x2="1300" y2="506.4" class="grid"/>
  <line x1="150" y1="392.7" x2="1300" y2="392.7" class="grid"/>
  <line x1="150" y1="279.1" x2="1300" y2="279.1" class="grid"/>
  <line x1="150" y1="165.5" x2="1300" y2="165.5" class="grid"/>
  <text x="138" y="625" text-anchor="end" class="small">0</text>
  <text x="138" y="511" text-anchor="end" class="small">0,05</text>
  <text x="138" y="398" text-anchor="end" class="small">0,10</text>
  <text x="138" y="284" text-anchor="end" class="small">0,15</text>
  <text x="138" y="170" text-anchor="end" class="small">0,20</text>

  <!-- axis -->
  <path d="M150 620 L1330 620" class="axis" marker-end="url(#arr)"/>
  <text x="1348" y="626" text-anchor="start" class="strong">p</text>
  <text x="221.9" y="652" text-anchor="middle" class="small">0,70</text>
  <text x="581.3" y="652" text-anchor="middle" class="small">0,75</text>
  <text x="868.8" y="652" text-anchor="middle" class="small">0,79</text>
  <text x="1012.5" y="652" text-anchor="middle" class="small">0,81</text>
  <text x="1199.2" y="652" text-anchor="middle" class="small">0,836</text>

  <!-- reference verticals -->
  <line x1="902.6" y1="120" x2="902.6" y2="620" class="guide2"/>
  <text x="902.6" y="108" text-anchor="middle" class="tiny">p_info = 0,7947</text>
  <line x1="1008.5" y1="140" x2="1008.5" y2="620" class="guide"/>
  <text x="1008.5" y="132" text-anchor="middle" class="tiny">record 0,809439</text>
  <line x1="1199.2" y1="120" x2="1199.2" y2="620" class="guide2"/>
  <text x="1199.2" y="108" text-anchor="middle" class="tiny">p_N (conj.)</text>

  <!-- cancellation area between curves -->
  <path d="M221.9 594.3 L581.3 509.3 L868.8 338.2 L1012.5 272.3 L1199.2 160.6 L1199.2 531.0 L1012.5 555.3 L868.8 577.0 L581.3 608.5 L221.9 618.4 Z" fill="#ede9fe" opacity="0.6"/>
  <text x="710" y="540" text-anchor="middle" class="label">part détruite par la moyenne signée : 81 à 94 %</text>

  <!-- J series -->
  <path d="M221.9 594.3 L581.3 509.3 L868.8 338.2 L1012.5 272.3 L1199.2 160.6" class="jline"/>
  <circle cx="221.9" cy="594.3" r="7" fill="#334155" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="581.3" cy="509.3" r="7" fill="#334155" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="868.8" cy="338.2" r="7" fill="#334155" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1012.5" cy="272.3" r="7" fill="#334155" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1199.2" cy="160.6" r="7" fill="#334155" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1012.5" cy="328.2" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>

  <!-- D series -->
  <path d="M221.9 618.4 L581.3 608.5 L868.8 577.0 L1012.5 555.3 L1199.2 531.0" class="dline"/>
  <circle cx="221.9" cy="618.4" r="7" fill="#6d4aff" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="581.3" cy="608.5" r="7" fill="#6d4aff" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="868.8" cy="577.0" r="7" fill="#6d4aff" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1012.5" cy="555.3" r="7" fill="#6d4aff" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1199.2" cy="531.0" r="7" fill="#6d4aff" stroke="#f8fafc" stroke-width="2.5"/>
  <circle cx="1012.5" cy="572.1" r="5.5" fill="#f8fafc" stroke="#6d4aff" stroke-width="2.5"/>

  <!-- ratio row -->
  <text x="138" y="694" text-anchor="end" class="label">ratio D/J :</text>
  <text x="221.9" y="694" text-anchor="middle" class="ratio">6 %</text>
  <text x="581.3" y="694" text-anchor="middle" class="ratio">10 %</text>
  <text x="868.8" y="694" text-anchor="middle" class="ratio">15 %</text>
  <text x="1012.5" y="694" text-anchor="middle" class="ratio">19 % (16 %)</text>
  <text x="1199.2" y="694" text-anchor="middle" class="ratio">19 %</text>
  <text x="720" y="726" text-anchor="middle" class="tiny">Le ratio croît avec p : plus l'observation est fiable, moins les dendrogrammes se contredisent. Aucune extrapolation en L n'est faite depuis ce volume.</text>

  <!-- legend -->
  <g>
    <rect x="180" y="140" width="500" height="96" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="8"/>
    <line x1="200" y1="166" x2="248" y2="166" class="jline"/>
    <circle cx="224" cy="166" r="6" fill="#334155"/>
    <text x="260" y="171" text-anchor="start" class="label">enveloppe de Jensen J_L^× : carré avant la moyenne</text>
    <line x1="200" y1="196" x2="248" y2="196" class="dline"/>
    <circle cx="224" cy="196" r="6" fill="#6d4aff"/>
    <text x="260" y="201" text-anchor="start" class="label">cible répliquée D_L^× : moyenne avant le carré</text>
    <circle cx="224" cy="222" r="5.5" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
    <text x="260" y="227" text-anchor="start" class="label">graine de contrôle 20260806 (p = 0,81)</text>
  </g>
</svg>
