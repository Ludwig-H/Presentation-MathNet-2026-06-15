<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="505" viewBox="0 0 1440 505" role="img" aria-labelledby="title desc">
  <title id="title">Le gel Swendsen-Wang du chapitre 11 sur le SBM</title>
  <desc id="desc">Une paire intra-classe présente et satisfaite gèle avec probabilité totale a moins b sur n ; une paire inter-classes non observée, satisfaite comme interaction répulsive, gèle avec la même probabilité totale : le graphe gelé est un Erdos-Renyi de degré moyen a moins b, et l'obstruction du chapitre 11 ne mord que sous a moins b inférieur à un.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrsm" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .label { font: 500 15px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 11px Inter, Arial, sans-serif; fill: #64748b; }
      .formula { font: 700 17px Inter, Arial, sans-serif; fill: #172033; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .boxdark { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .boxwarn { fill: #fff1f2; stroke: #f3a6aa; stroke-width: 2; }
      .boxok { fill: #ecfdf3; stroke: #36a269; stroke-width: 2; }
      .boxblue { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 2; }
      .boxamber { fill: #fef3c7; stroke: #fcd34d; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arr); }
      .arrowsm { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrsm); }
      .arrowlight { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrl); stroke-dasharray: 6 5; }
      .axis { stroke: #334155; stroke-width: 2; }
      .curve { fill: none; stroke: #6d4aff; stroke-width: 3.5; stroke-linecap: round; }
      .curve2 { fill: none; stroke: #e5484d; stroke-width: 3; stroke-linecap: round; }
      .curve3 { fill: none; stroke: #36a269; stroke-width: 3; stroke-linecap: round; }
      .guide { stroke: #e5484d; stroke-width: 2; stroke-dasharray: 8 6; }
      .guide2 { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 6; }
      .spin { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .posedge { stroke: #334155; stroke-width: 2.5; }
      .negedge { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .frozen { stroke: #6d4aff; stroke-width: 4.5; }
      .tree { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="505" fill="#f8fafc"/>
  <text x="720" y="42" text-anchor="middle" class="title">Le pas Swendsen–Wang du chapitre 11 sur le SBM (fait I.9)</text>
  <text x="720" y="70" text-anchor="middle" class="subtitle">les deux types de paires gèlent avec exactement la même probabilité (a−b)/n : le gel est un Erdős–Rényi</text>
  <rect x="40" y="100" width="430" height="250" rx="14" class="box"/>
  <text x="255" y="132" text-anchor="middle" class="panel-title">paire intra-classe</text>
  <circle cx="150" cy="200" r="16" class="spin"/>
  <text x="150" y="206" text-anchor="middle" class="formula">+</text>
  <circle cx="360" cy="200" r="16" class="spin"/>
  <text x="360" y="206" text-anchor="middle" class="formula">+</text>
  <line x1="166" y1="200" x2="344" y2="200" class="posedge frozen"/>
  <text x="255" y="168" text-anchor="middle" class="small">présente : a/n</text>
  <text x="255" y="250" text-anchor="middle" class="small">satisfaite, gelée avec 1 − e^{−uₙ} = 1 − b/a</text>
  <text x="255" y="292" text-anchor="middle" class="label">total :</text>
  <text x="255" y="322" text-anchor="middle" class="formula">(a/n)(1 − b/a) = (a−b)/n</text>
  <rect x="505" y="100" width="430" height="250" rx="14" class="box"/>
  <text x="720" y="132" text-anchor="middle" class="panel-title">paire inter-classes</text>
  <circle cx="615" cy="200" r="16" class="spin"/>
  <text x="615" y="206" text-anchor="middle" class="formula">+</text>
  <circle cx="825" cy="200" r="16" class="spin"/>
  <text x="825" y="206" text-anchor="middle" class="formula">−</text>
  <line x1="631" y1="200" x2="809" y2="200" class="negedge frozen"/>
  <text x="720" y="168" text-anchor="middle" class="small">non observée : 1 − b/n (répulsive satisfaite)</text>
  <text x="720" y="250" text-anchor="middle" class="small">gelée avec 1 − e^{−h₀,ₙ} = (a−b)/(n−b)</text>
  <text x="720" y="292" text-anchor="middle" class="label">total :</text>
  <text x="720" y="322" text-anchor="middle" class="formula">(1 − b/n)·(a−b)/(n−b) = (a−b)/n</text>
  <rect x="970" y="100" width="430" height="250" rx="14" class="boxdark"/>
  <text x="1185" y="132" text-anchor="middle" class="panel-title">objet gelé</text>
  <text x="1185" y="175" text-anchor="middle" class="formula">G(n, (a−b)/n)</text>
  <text x="1185" y="202" text-anchor="middle" class="label">degré moyen → a − b = 2dθ</text>
  <text x="1185" y="240" text-anchor="middle" class="small">obstruction du théorème θ^max :</text>
  <text x="1185" y="266" text-anchor="middle" class="formula">a − b ≤ 1, i.e. dθ ≤ 1/2</text>
  <text x="1185" y="305" text-anchor="middle" class="small">au seuil KS : a − b = 2√d &gt; 2</text>
  <text x="1185" y="327" text-anchor="middle" class="small">le pas aux racines est loin du seuil</text>
  <path d="M470 225 L505 225" class="arrowsm"/>
  <path d="M935 225 L970 225" class="arrowsm"/>
  <rect x="40" y="380" width="1360" height="92" rx="14" class="boxwarn"/>
  <text x="720" y="410" text-anchor="middle" class="panel-title">Attention au facteur 2 (définition I.10)</text>
  <text x="720" y="437" text-anchor="middle" class="small">gel complet avec port (fait I.9) : degré 2dθ, seuil a−b = 1 · forêt des seules arêtes observées (limite locale) : degré dθ, seuil dθ = 1</text>
  <text x="720" y="459" text-anchor="middle" class="small">l'écart entre les deux comptabilités est exactement la contribution du port répulsif</text>

</svg>
