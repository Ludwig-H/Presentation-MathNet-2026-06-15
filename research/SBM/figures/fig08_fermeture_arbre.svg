<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="615" viewBox="0 0 1440 615" role="img" aria-labelledby="title desc">
  <title id="title">Fermeture du seuil sur l'arbre de Galton-Watson</title>
  <desc id="desc">Deux panneaux : à gauche le second moment avec la somme des spins des feuilles et la borne ell t ; à droite la preuve d'information avec la sous-additivité sur les branches et le facteur theta carré de SDPI par niveau.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrsm" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .label { font: 500 15px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 11px Inter, Arial, sans-serif; fill: #64748b; }
      .formula { font: 700 17px Inter, Arial, sans-serif; fill: #172033; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .boxdark { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .boxwarn { fill: #fff1f2; stroke: #f3a6aa; stroke-width: 2; }
      .boxok { fill: #ecfdf3; stroke: #36a269; stroke-width: 2; }
      .boxblue { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 2; }
      .boxamber { fill: #fef3c7; stroke: #fcd34d; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arr); }
      .arrowsm { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrsm); }
      .arrowlight { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrl); stroke-dasharray: 6 5; }
      .axis { stroke: #334155; stroke-width: 2; }
      .curve { fill: none; stroke: #6d4aff; stroke-width: 3.5; stroke-linecap: round; }
      .curve2 { fill: none; stroke: #e5484d; stroke-width: 3; stroke-linecap: round; }
      .curve3 { fill: none; stroke: #36a269; stroke-width: 3; stroke-linecap: round; }
      .guide { stroke: #e5484d; stroke-width: 2; stroke-dasharray: 8 6; }
      .guide2 { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 6; }
      .spin { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .posedge { stroke: #334155; stroke-width: 2.5; }
      .negedge { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .frozen { stroke: #6d4aff; stroke-width: 4.5; }
      .tree { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="615" fill="#f8fafc"/>
  <text x="720" y="42" text-anchor="middle" class="title">La fermeture sur l'arbre : deux directions, deux mécanismes</text>
  <text x="720" y="70" text-anchor="middle" class="subtitle">théorème I.17 (second moment, λ &gt; 1) et théorème I.18 (information, λ &lt; 1)</text>
  <rect x="40" y="100" width="660" height="480" rx="14" class="box"/>
  <text x="370" y="132" text-anchor="middle" class="panel-title">I.17 — second moment (reconstruction si λ &gt; 1)</text>
  <path d="M370 180 L290.0 250 M370 180 L450.0 250 M290.0 250 L250.0 330 M290.0 250 L330.0 330 M450.0 250 L410.0 330 M450.0 250 L490.0 330" class="tree"/>
  <circle cx="370" cy="180" r="9" class="spin"/>
  <circle cx="290.0" cy="250" r="9" class="spin"/>
  <circle cx="450.0" cy="250" r="9" class="spin"/>
  <circle cx="250.0" cy="330" r="9" class="spin"/>
  <circle cx="330.0" cy="330" r="9" class="spin"/>
  <circle cx="410.0" cy="330" r="9" class="spin"/>
  <circle cx="490.0" cy="330" r="9" class="spin"/>
  <text x="370" y="164" text-anchor="middle" class="small">σ_ρ</text>
  <text x="250.0" y="360" text-anchor="middle" class="tiny">σ_v</text>
  <text x="490.0" y="360" text-anchor="middle" class="tiny">σ_v</text>
  <text x="370" y="375" text-anchor="middle" class="formula">Z_t = Σ_{v∈L_t} σ_v</text>
  <text x="370" y="410" text-anchor="middle" class="small">E[σ_ρ Z_t] = (dθ)^t ; E[Z_t²] = (dθ)^{2t} Σ_{s≤t} λ^{−s}</text>
  <text x="370" y="442" text-anchor="middle" class="small">Cauchy–Schwarz :</text>
  <text x="370" y="472" text-anchor="middle" class="formula">q_t ≥ ℓ_t(λ) → (λ−1)/λ &gt; 0</text>
  <text x="370" y="505" text-anchor="middle" class="small">récursion poissonienne E[N(N−1)] = d², certifiée</text>
  <text x="370" y="525" text-anchor="middle" class="small">en arithmétique rationnelle exacte</text>
  <rect x="740" y="100" width="660" height="480" rx="14" class="box"/>
  <text x="1070" y="132" text-anchor="middle" class="panel-title">I.18 — information (pas de reconstruction si λ &lt; 1)</text>
  <path d="M1070 180 L990.0 250 M1070 180 L1150.0 250 M990.0 250 L950.0 330 M990.0 250 L1030.0 330 M1150.0 250 L1110.0 330 M1150.0 250 L1190.0 330" class="tree"/>
  <circle cx="1070" cy="180" r="9" class="spin"/>
  <circle cx="990.0" cy="250" r="9" class="spin"/>
  <circle cx="1150.0" cy="250" r="9" class="spin"/>
  <circle cx="950.0" cy="330" r="9" class="spin"/>
  <circle cx="1030.0" cy="330" r="9" class="spin"/>
  <circle cx="1110.0" cy="330" r="9" class="spin"/>
  <circle cx="1190.0" cy="330" r="9" class="spin"/>
  <path d="M1070 180 L990 250" class="curve2"/>
  <path d="M1070 180 L1150 250" class="curve2"/>
  <text x="1002" y="205" text-anchor="end" class="formula">×θ²</text>
  <text x="1140" y="205" text-anchor="start" class="formula">×θ²</text>
  <text x="1070" y="164" text-anchor="middle" class="small">σ_ρ</text>
  <text x="1070" y="375" text-anchor="middle" class="small">lemme C : I(ρ ; branches) ≤ Σ I(ρ ; branche)</text>
  <text x="1070" y="400" text-anchor="middle" class="small">lemme B : I(ρ ; ·) ≤ θ² I(σ_enfant ; ·)   (série de ψ)</text>
  <text x="1070" y="435" text-anchor="middle" class="formula">I(σ_ρ ; σ_{L_t}) ≤ ln2 · |L_t| θ^{2t}</text>
  <text x="1070" y="468" text-anchor="middle" class="formula">E_PGW : ln2 · λ^t → 0,  puis q_t ≤ 2I</text>
  <text x="1070" y="505" text-anchor="middle" class="small">ψ(m) = Σ m^{2k}/(2k(2k−1)) ≥ m²/2 :</text>
  <text x="1070" y="525" text-anchor="middle" class="small">tout est élémentaire, aucune SDPI importée</text>

</svg>
