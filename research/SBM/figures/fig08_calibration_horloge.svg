  <text x="202" y="418.6666666666667" text-anchor="start" class="small">1/d = 1/6 (λ = 1.5)</text>
  <circle cx="551.4" cy="360.0" r="6" fill="#0284c7"/>
  <circle cx="1306.1" cy="160.0" r="6" fill="#6d4aff"/>
  <text x="1296.078431372549" y="148.00000000000006" text-anchor="end" class="small">q₁ = θ (forêt SW des arêtes observées)</text>
  <rect x="160" y="626" width="1120" height="96" rx="14" class="boxok"/>
  <text x="720" y="656" text-anchor="middle" class="formula">d = 4 : β_χ = β_c — le point de Kesten–Stigum dθ² = 1 (fait I.15)</text>
  <text x="720" y="684" text-anchor="middle" class="small">d = 3 (λ &lt; 1) : β_χ &lt; β_c, l'information s'éteint avant que les blocs deviennent critiques ;</text>
  <text x="720" y="706" text-anchor="middle" class="small">d = 6 (λ &gt; 1) : β_χ &gt; β_c, l'information percole encore à la coupe géométrique</text>

</svg>
