  <line x1="110" y1="360.0" x2="1306.1" y2="360.0" class="guide2"/>
  <text x="96" y="365.0" text-anchor="end" class="small">θ² = 0.25</text>
  <line x1="551.4" y1="360.0" x2="551.4" y2="560" class="guide2"/>
  <text x="551.4369614145311" y="588" text-anchor="middle" class="formula">β_χ</text>
  <line x1="110" y1="293.3" x2="749.9" y2="293.3" class="guide"/>
  <line x1="749.9" y1="293.3" x2="749.9" y2="560" class="guide"/>
  <circle cx="749.9" cy="293.3" r="6" fill="#e5484d"/>
  <text x="749.9336320824791" y="588" text-anchor="middle" class="small">β_c(d=3)</text>
  <text x="202" y="285.33333333333337" text-anchor="start" class="small">1/d = 1/3 (λ = 0.75)</text>
  <line x1="110" y1="360.0" x2="551.4" y2="360.0" class="guide"/>
  <line x1="551.4" y1="360.0" x2="551.4" y2="560" class="guide"/>
  <circle cx="551.4" cy="360.0" r="6" fill="#e5484d"/>
  <text x="551.4369614145311" y="610" text-anchor="middle" class="small">β_c(d=4) = β_χ</text>
  <text x="202" y="352.0" text-anchor="start" class="small">1/d = 1/4 (λ = 1)</text>
  <line x1="110" y1="426.7" x2="383.6" y2="426.7" class="guide"/>
  <line x1="383.6" y1="426.7" x2="383.6" y2="560" class="guide"/>
  <circle cx="383.6" cy="426.7" r="6" fill="#e5484d"/>
