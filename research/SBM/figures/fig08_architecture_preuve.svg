<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="800" viewBox="0 0 1440 800" role="img" aria-labelledby="title desc">
  <title id="title">Architecture des démonstrations de la note 08</title>
  <desc id="desc">Deux colonnes parallèles : la preuve du seuil de weak recovery à la coupe critique, et la preuve du seuil d'almost exact recovery à beta tendant vers zéro, reliées par la limite beta vers zéro. Un bandeau liste les quatre emprunts à la littérature.</desc>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrsm" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="10" refX="12" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 26px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 16px Inter, Arial, sans-serif; fill: #475569; }
      .panel-title { font: 700 19px Inter, Arial, sans-serif; fill: #172033; }
      .label { font: 500 15px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 13px Inter, Arial, sans-serif; fill: #475569; }
      .tiny { font: 500 11px Inter, Arial, sans-serif; fill: #64748b; }
      .formula { font: 700 17px Inter, Arial, sans-serif; fill: #172033; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .boxdark { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 2; }
      .boxwarn { fill: #fff1f2; stroke: #f3a6aa; stroke-width: 2; }
      .boxok { fill: #ecfdf3; stroke: #36a269; stroke-width: 2; }
      .boxblue { fill: #e0f2fe; stroke: #7dd3fc; stroke-width: 2; }
      .boxamber { fill: #fef3c7; stroke: #fcd34d; stroke-width: 2; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arr); }
      .arrowsm { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrsm); }
      .arrowlight { fill: none; stroke: #94a3b8; stroke-width: 2; marker-end: url(#arrl); stroke-dasharray: 6 5; }
      .axis { stroke: #334155; stroke-width: 2; }
      .curve { fill: none; stroke: #6d4aff; stroke-width: 3.5; stroke-linecap: round; }
      .curve2 { fill: none; stroke: #e5484d; stroke-width: 3; stroke-linecap: round; }
      .curve3 { fill: none; stroke: #36a269; stroke-width: 3; stroke-linecap: round; }
      .guide { stroke: #e5484d; stroke-width: 2; stroke-dasharray: 8 6; }
      .guide2 { stroke: #0284c7; stroke-width: 2; stroke-dasharray: 8 6; }
      .spin { fill: #ffffff; stroke: #334155; stroke-width: 2.5; }
      .posedge { stroke: #334155; stroke-width: 2.5; }
      .negedge { stroke: #334155; stroke-width: 2.5; stroke-dasharray: 6 5; }
      .frozen { stroke: #6d4aff; stroke-width: 4.5; }
      .tree { fill: none; stroke: #334155; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1440" height="800" fill="#f8fafc"/>
  <text x="720" y="42" text-anchor="middle" class="title">Architecture des deux démonstrations</text>
  <text x="720" y="70" text-anchor="middle" class="subtitle">une seule construction — la dynamique coupée à β — lue à deux niveaux de coupe</text>
  <rect x="40" y="95" width="660" height="560" rx="14" class="box"/>
  <text x="370" y="128" text-anchor="middle" class="panel-title">Partie I — weak recovery à β_c</text>
  <rect x="70" y="150" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="176" text-anchor="middle" class="label">Cadre bayésien du chapitre 11 (I.1–I.4)</text>
  <text x="370" y="198" text-anchor="middle" class="small">postérieure de Gibbs signée, overlap, random guess</text>
  <rect x="70" y="228" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="254" text-anchor="middle" class="label">Nishimori et couplages invariants (I.5–I.6)</text>
  <text x="370" y="276" text-anchor="middle" class="small">la vérité est remplaçable par une réplique</text>
  <rect x="70" y="306" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="332" text-anchor="middle" class="label">Critère à deux répliques (I.7)</text>
  <text x="370" y="354" text-anchor="middle" class="small">weak recovery ⟺ liminf Qₙ &gt; 0</text>
  <rect x="70" y="384" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="410" text-anchor="middle" class="label">Dynamique coupée invariante (I.8–I.11)</text>
  <text x="370" y="432" text-anchor="middle" class="small">horloges, dendrogramme, gel à β ; β=1 = SW du ch. 11 (I.9)</text>
  <rect x="70" y="462" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="488" text-anchor="middle" class="label">Deux dendrogrammes indépendants (I.12–I.15)</text>
  <text x="370" y="510" text-anchor="middle" class="small">θ×θ = θ² ; calibration β_χ = β_c ⟺ dθ² = 1</text>
  <rect x="70" y="540" width="600" height="62" rx="14" class="box"/>
  <text x="370" y="566" text-anchor="middle" class="label">Fermeture sur l'arbre (I.17–I.18)</text>
  <text x="370" y="588" text-anchor="middle" class="small">second moment exact ; information ψ-SDPI</text>
  <path d="M370 212 L370 228" class="arrow"/>
  <path d="M370 290 L370 306" class="arrow"/>
  <path d="M370 368 L370 384" class="arrow"/>
  <path d="M370 446 L370 462" class="arrow"/>
  <path d="M370 524 L370 540" class="arrow"/>
  <rect x="740" y="95" width="660" height="560" rx="14" class="box"/>
  <text x="1070" y="128" text-anchor="middle" class="panel-title">Partie II — almost exact à β→0</text>
  <rect x="770" y="150" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="176" text-anchor="middle" class="label">Régime divergent (II.1–II.2)</text>
  <text x="1070" y="198" text-anchor="middle" class="small">λₙ → ∞ ⟹ β_c,n ≤ 2/λₙ → 0 : la coupe s'écrase</text>
  <rect x="770" y="228" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="254" text-anchor="middle" class="label">β = 0 : Glauber (II.3)</text>
  <text x="1070" y="276" text-anchor="middle" class="small">la dynamique coupée dégénère en bain mono-site</text>
  <rect x="770" y="306" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="332" text-anchor="middle" class="label">Expérience oracle d'un site (II.4–II.5)</text>
  <text x="1070" y="354" text-anchor="middle" class="small">affinité exacte E[e^{−Δ/2}] = ρⁿ⁻¹</text>
  <rect x="770" y="384" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="410" text-anchor="middle" class="label">Le Cam par site (II.6)</text>
  <text x="1070" y="432" text-anchor="middle" class="small">λₙ borné ⟹ almost exact impossible (complet)</text>
  <rect x="770" y="462" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="488" text-anchor="middle" class="label">Stabilité de la vérité (II.7)</text>
  <text x="1070" y="510" text-anchor="middle" class="small">site à la vérité : proba de flip ≤ Hₙ ; balayage entier : ≤ nHₙ ; Hₙ→0 ⟺ λₙ→∞</text>
  <rect x="770" y="540" width="600" height="62" rx="14" class="box"/>
  <text x="1070" y="566" text-anchor="middle" class="label">Synthèse (§II.4)</text>
  <text x="1070" y="588" text-anchor="middle" class="small">même architecture, unité = le site, seuil λₙ → ∞</text>
  <path d="M1070 212 L1070 228" class="arrow"/>
  <path d="M1070 290 L1070 306" class="arrow"/>
  <path d="M1070 368 L1070 384" class="arrow"/>
  <path d="M1070 446 L1070 462" class="arrow"/>
  <path d="M1070 524 L1070 540" class="arrow"/>
  <path d="M700 420 C720 420, 720 420, 740 420" class="arrowsm"/>
  <text x="720" y="405" text-anchor="middle" class="formula">β→0</text>
  <rect x="40" y="675" width="1360" height="100" rx="14" class="boxwarn"/>
  <text x="720" y="703" text-anchor="middle" class="panel-title">Emprunts délimités (tout le reste est démontré dans la note)</text>
  <text x="720" y="730" text-anchor="middle" class="small">E1 : limite locale SBM → PGW(d) · E2 : cas critique λ=1 sur l'arbre (EKPS ; Abbe–Boix) · E3a : impossibilité graphe fini (MNS) · E3b : achievability (Massoulié, MNS)</text>
  <text x="720" y="755" text-anchor="middle" class="small">+ deux théorèmes du chapitre 11 repris tels quels : invariance par balance locale, borne θ^max</text>

</svg>
