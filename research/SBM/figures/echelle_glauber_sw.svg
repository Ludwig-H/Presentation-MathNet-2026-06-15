<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">Échelle de la dynamique hiérarchique</title>
  <desc id="desc">Après projection au seul état de la coupe B beta, le temps beta va de zéro à un. À zéro, B zéro est vide et des mises à jour séquentielles de la postérieure donnent Glauber. Aux temps intermédiaires, des bains thermiques de blocs utilisent les ports. À un, les orientations globales des racines donnent Swendsen-Wang. Dans les régimes almost exact et exact, le beta critique géométrique tend vers zéro.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 500 17px Inter, Arial, sans-serif; fill: #475569; }
      .head { font: 700 21px Inter, Arial, sans-serif; fill: #172033; }
      .label { font: 500 16px Inter, Arial, sans-serif; fill: #334155; }
      .small { font: 500 14px Inter, Arial, sans-serif; fill: #475569; }
      .formula { font: 700 18px Inter, Arial, sans-serif; fill: #172033; }
      .line { stroke: #334155; stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .soft { stroke: #64748b; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .arrow { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1400" height="620" fill="#f8fafc"/>
  <text x="700" y="48" text-anchor="middle" class="title">Famille de projections à une coupe Bβ</text>
  <text x="700" y="78" text-anchor="middle" class="subtitle">Le reste de D est marginalisé ; β est un temps d'horloge, pas une température Gibbs</text>

  <!-- Timeline -->
  <line x1="125" y1="142" x2="1275" y2="142" class="arrow"/>
  <circle cx="150" cy="142" r="9" fill="#0ea5e9"/>
  <circle cx="700" cy="142" r="9" fill="#8b5cf6"/>
  <circle cx="1250" cy="142" r="9" fill="#22a06b"/>
  <text x="150" y="122" text-anchor="middle" class="formula">β = 0</text>
  <text x="700" y="122" text-anchor="middle" class="formula">0 &lt; β &lt; 1</text>
  <text x="1250" y="122" text-anchor="middle" class="formula">β = 1</text>

  <!-- Panels -->
  <rect x="55" y="185" width="365" height="320" rx="22" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="518" y="185" width="365" height="320" rx="22" fill="#ffffff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="980" y="185" width="365" height="320" rx="22" fill="#ffffff" stroke="#86efac" stroke-width="2"/>

  <text x="238" y="224" text-anchor="middle" class="head">Feuilles</text>
  <text x="700" y="224" text-anchor="middle" class="head">Blocs intermédiaires</text>
  <text x="1163" y="224" text-anchor="middle" class="head">Racines finales</text>

  <!-- Singletons -->
  <g fill="#e0f2fe" stroke="#0284c7" stroke-width="3">
    <circle cx="105" cy="300" r="19"/><circle cx="170" cy="276" r="19"/>
    <circle cx="238" cy="315" r="19"/><circle cx="305" cy="273" r="19"/>
    <circle cx="370" cy="304" r="19"/>
  </g>
  <path d="M112 355 C175 385, 298 385, 362 355" stroke="#0284c7" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="238" y="411" text-anchor="middle" class="label">heat bath mono-site séquentiel</text>
  <text x="238" y="441" text-anchor="middle" class="formula">⇒ Glauber</text>
  <text x="238" y="473" text-anchor="middle" class="small">B₀ est vide ; le reste de D est marginalisé.</text>
  <text x="238" y="493" text-anchor="middle" class="small">Il faut ensuite choisir ce programme local.</text>

  <!-- Intermediate clusters -->
  <rect x="555" y="263" width="102" height="101" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="675" y="249" width="166" height="129" rx="22" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
  <g fill="#ffffff" stroke="#6d4aff" stroke-width="2.5">
    <circle cx="585" cy="300" r="10"/><circle cx="627" cy="328" r="10"/>
    <circle cx="710" cy="292" r="10"/><circle cx="758" cy="276" r="10"/>
    <circle cx="805" cy="314" r="10"/><circle cx="740" cy="345" r="10"/>
  </g>
  <path d="M585 300 L627 328 M710 292 L758 276 L805 314 M710 292 L740 345" class="soft"/>
  <path d="M657 314 L675 314" stroke="#e5484d" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="700" y="411" text-anchor="middle" class="label">messages internes + ports conjoints</text>
  <text x="700" y="441" text-anchor="middle" class="formula">⇒ heat baths hiérarchiques</text>
  <text x="700" y="473" text-anchor="middle" class="small">Les facteurs au-dessus de la coupe</text>
  <text x="700" y="493" text-anchor="middle" class="small">restent dans le Gibbs exact.</text>

  <!-- Root clusters -->
  <g>
    <ellipse cx="1080" cy="315" rx="68" ry="64" fill="#dcfce7" stroke="#22a06b" stroke-width="3"/>
    <ellipse cx="1242" cy="315" rx="68" ry="64" fill="#ecfdf3" stroke="#22a06b" stroke-width="3"/>
    <g fill="#ffffff" stroke="#15803d" stroke-width="2">
      <circle cx="1050" cy="295" r="9"/><circle cx="1090" cy="280" r="9"/><circle cx="1105" cy="328" r="9"/><circle cx="1063" cy="344" r="9"/>
      <circle cx="1212" cy="293" r="9"/><circle cx="1250" cy="278" r="9"/><circle cx="1270" cy="323" r="9"/><circle cx="1225" cy="346" r="9"/>
    </g>
  </g>
  <path d="M1080 390 C1125 417, 1198 417, 1242 390" stroke="#15803d" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  <text x="1163" y="441" text-anchor="middle" class="formula">⇒ Swendsen–Wang</text>
  <text x="1163" y="473" text-anchor="middle" class="small">si les orientations de racines</text>
  <text x="1163" y="493" text-anchor="middle" class="small">factorisent sous l'a priori.</text>

  <!-- Dense-regime annotation -->
  <rect x="330" y="536" width="740" height="57" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="700" y="561" text-anchor="middle" class="label" fill="#9a3412">Almost/exact : λn → ∞ entraîne βc,n → 0, mais la coupe reste un ordre d'élimination.</text>
  <text x="700" y="584" text-anchor="middle" class="small" fill="#9a3412">Almost/exact recovery exige ensuite un fonctionnel Hellinger–Chernoff et des queues locales.</text>
</svg>
